<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ConnectHub — Projetos e talentos da ETEC Camargo Aranha</title>
    <meta
      name="description"
      content="Descubra projetos de alunos, conheça talentos e conecte-se com a comunidade da ETEC Camargo Aranha."
    />
    <meta property="og:title" content="ConnectHub — Grandes ideias começam quando pessoas se conectam" />
    <meta
      property="og:description"
      content="Projetos, talentos e conexões entre alunos da ETEC Camargo Aranha."
    />
    <meta name="theme-color" content="#3a3fd9" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('connecthub.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <!--preconnect-->
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="modulepreload" href="/js/main.js" />
    <script src="/config.js"></script>
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="aurora"><i></i><i></i><i></i></div>
      <canvas data-bg></canvas>
    </div>
    <div id="header"></div>
    <main id="app" tabindex="-1"></main>
    <div id="footer"></div>
    <div id="toasts" aria-live="polite"></div>
    <noscript>O ConnectHub precisa de JavaScript para funcionar.</noscript>
  </body>
</html>
